<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ความคิดเห็น - Lertao Cake</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; background-color: #fdfbf7; } .navbar { background-color: #212529 !important; }</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍰 Lertao Cake</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">หน้าหลัก</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">สินค้า</a></li>
                    <li class="nav-item"><a class="nav-link" href="promotion.html">โปรโมชัน</a></li>
                    <li class="nav-item"><a class="nav-link" href="payment.html">การชำระเงิน</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">ติดต่อเรา</a></li>
                    <li class="nav-item"><a class="nav-link active" href="feedback.html">ความคิดเห็น</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-center mb-4" style="color: #d97736;">แสดงความคิดเห็นของคุณ</h2>
        <div class="row justify-content-center">
            <div class="col-md-6 card p-4 shadow-sm">
                <form id="feedbackForm" onsubmit="return validateForm()">
                    <div class="mb-3">
                        <label class="form-label">ชื่อผู้แสดงความคิดเห็น</label>
                        <input type="text" id="name" class="form-control" placeholder="กรอกชื่อของคุณ">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ข้อความความคิดเห็น</label>
                        <textarea id="message" class="form-control" rows="4" placeholder="พิมพ์ความคิดเห็นที่นี่..."></textarea>
                    </div>
                    <button type="submit" class="btn text-white w-100" style="background-color: #d97736;">ส่งความคิดเห็น</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function validateForm() {
            let name = document.getElementById("name").value;
            let message = document.getElementById("message").value;
            
            if (name.trim() === "" || message.trim() === "") {
                alert("กรุณากรอกข้อมูลให้ครบถ้วนก่อนส่งความคิดเห็น!");
                return false;
            }
            alert("ขอบคุณสำหรับความคิดเห็นของคุณ!");
            return true;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
